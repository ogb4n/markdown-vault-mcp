services:
  markdown-vault-mcp:
    build: .
    image: markdown-vault-mcp:latest
    restart: unless-stopped
    entrypoint: ["markdown-vault-mcp-http"]
    # The container writes into the vault: it must run as the user that owns it,
    # otherwise every write is refused (or leaves root-owned files behind).
    user: "${VAULT_UID_GID:-1000:1000}"
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 27125
      MCP_HTTP_TOKEN: ${MCP_HTTP_TOKEN:-}
      MCP_HTTP_ALLOWED_HOSTS: ${MCP_HTTP_ALLOWED_HOSTS:-}
      MCP_HTTP_ALLOWED_ORIGINS: ${MCP_HTTP_ALLOWED_ORIGINS:-}
      MARKDOWN_REPOSITORIES: '{"vault":"/vault"}'
      MARKDOWN_DEFAULT_REPOSITORY: vault
    ports:
      - "${MCP_HTTP_BIND:-127.0.0.1}:${MCP_HTTP_PORT:-27125}:27125"
    volumes:
      - "${VAULT_DIR:?VAULT_DIR must point at the vault directory}:/vault"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:27125/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
