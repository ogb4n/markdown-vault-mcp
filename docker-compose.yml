services:
  markdown-repositories:
    build: .
    image: mcp-markdown-repositories:latest
    restart: unless-stopped
    entrypoint: ["mcp-markdown-repositories-http"]
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 27125
      MCP_HTTP_TOKEN: ${MCP_HTTP_TOKEN:-}
      MCP_HTTP_ALLOWED_HOSTS: ${MCP_HTTP_ALLOWED_HOSTS:-}
      MCP_HTTP_ALLOWED_ORIGINS: ${MCP_HTTP_ALLOWED_ORIGINS:-}
      ONEDRIVE_CLIENT_ID: ${ONEDRIVE_CLIENT_ID:-}
      ONEDRIVE_TENANT_ID: ${ONEDRIVE_TENANT_ID:-consumers}
      ONEDRIVE_REFRESH_TOKEN_FILE: /state/onedrive-refresh-token
      MARKDOWN_REPOSITORIES: ${MARKDOWN_REPOSITORIES:-}
      MARKDOWN_DEFAULT_REPOSITORY: ${MARKDOWN_DEFAULT_REPOSITORY:-}
    ports:
      - "127.0.0.1:${MCP_HTTP_PORT:-27125}:27125"
    volumes:
      - onedrive-tokens:/state
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:27125/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  onedrive-auth:
    image: mcp-markdown-repositories:latest
    build: .
    profiles: ["auth"]
    entrypoint: ["mcp-markdown-repositories-auth"]
    environment:
      ONEDRIVE_CLIENT_ID: ${ONEDRIVE_CLIENT_ID:-}
      ONEDRIVE_TENANT_ID: ${ONEDRIVE_TENANT_ID:-consumers}
      ONEDRIVE_REFRESH_TOKEN_FILE: /state/onedrive-refresh-token
    volumes:
      - onedrive-tokens:/state

volumes:
  onedrive-tokens:
