[project]
name = "mcp-markdown-repositories"
version = "0.3.0"
description = "MCP server for OneDrive-backed Markdown repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
 "mcp>=1.1.0,<2.0.0",
 "requests>=2.32.3",
 "starlette>=0.41.0",
 "uvicorn>=0.32.0",
]
[[project.authors]]
name = "Markus Pfundstein"
email = "markus@life-electronic.nl"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_markdown_repositories"]

[dependency-groups]
dev = [
    "pyright>=1.1.389",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
mcp-markdown-repositories = "mcp_markdown_repositories:main"
mcp-markdown-repositories-http = "mcp_markdown_repositories.http_server:main_http"
mcp-markdown-repositories-auth = "mcp_markdown_repositories.auth:main"
