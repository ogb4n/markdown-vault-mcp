[project]
name = "markdown-vault-mcp"
version = "0.3.0"
description = "MCP server for local Markdown repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
 "mcp>=1.1.0,<2.0.0",
 "starlette>=0.41.0",
 "uvicorn>=0.32.0",
]
[[project.authors]]
name = "Markus Pfundstein"
email = "markus@life-electronic.nl"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markdown_vault_mcp"]

[dependency-groups]
dev = [
    "pyright>=1.1.389",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
markdown-vault-mcp = "markdown_vault_mcp:main"
markdown-vault-mcp-http = "markdown_vault_mcp.http_server:main_http"
